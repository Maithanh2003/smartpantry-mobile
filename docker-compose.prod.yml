# Production — optimized web build + nginx only (like backend docker-compose.prod.yml).
# Copy env/prod.json from env/production.json.example and set real API URL.
#
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  flutter-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DART_DEFINE_ENV_FILE: ${DART_DEFINE_ENV_FILE:-env/prod.json}
    container_name: smartpantry-flutter-prod
    ports:
      - "${FLUTTER_WEB_PORT:-80}:80"
    restart: unless-stopped
